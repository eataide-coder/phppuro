<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <h1>Login</h1>
    <form id="form" method="GET">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" value="eataide@outlook.com" required>
        <br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" value="123456" required>
        <br>
        <button type="button" id="btn_login" class="btn_auth">Login</button>
        <input type="submit" value="Login">
    </form>
    <div>
        <button id="btn_check_auth" class="btn_auth">Verificar Autenticação</button>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        const form = document.getElementById('btn_login');
        form.addEventListener('click', function () {
            console.log('Form submitted');
        })

        const btnCheckAuth = document.getElementById('btn_check_auth');
        btnCheckAuth.addEventListener('click', function () {
            console.log('Checking authentication...');
        });
    </script>
</body>
</html>
